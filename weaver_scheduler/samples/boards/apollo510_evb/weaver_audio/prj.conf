# Weaver audio sample for apollo510_evb (non-Blue variant).
# On-board hardware only: LEDs, buttons, and the SoC's PDM0.

CONFIG_WEAVER_SCHED=y
CONFIG_WEAVER_WEARABLE_PRESET=y
CONFIG_WEAVER_BATCH_SCALAR=y
CONFIG_WEAVER_TIMING=y

# Audio (DMIC) subsystem - depends on the apollo510 PDM driver
# being present in this Zephyr fork. If it isn't, the sample still
# builds; audio_sample just won't get real frames.
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# GPIO + LEDs + buttons
CONFIG_GPIO=y
CONFIG_LED=y
CONFIG_INPUT=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_RUNTIME_STATS=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_MP_MAX_NUM_CPUS=1

CONFIG_PM=y
CONFIG_PM_DEVICE=y
