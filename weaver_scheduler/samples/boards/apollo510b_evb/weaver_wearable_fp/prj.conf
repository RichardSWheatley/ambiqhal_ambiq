# Weaver wearable on Apollo510 Blue EVB at 96 MHz LP mode, FP variant.
# Same workload as weaver_wearable but using the floating-point
# scheduler. Suitable when your Weft threads already use the FPU.

CONFIG_WEAVER_SCHED_FP=y
CONFIG_WEAVER_FP_WEARABLE_PRESET=y
CONFIG_WEAVER_FP_TIMING=y

CONFIG_FPU=y

# Sensor API
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BMI270=y
CONFIG_MAX30101=y

# BLE host stack
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Weaver FP Wearable"
CONFIG_BT_DIS=y

# Logging / runtime
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_RUNTIME_STATS=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_MP_MAX_NUM_CPUS=1

CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
