# Host-side equivalence tests for the Weaver scheduler. These build
# with plain gcc and require no Zephyr SDK, so they run quickly on
# every push. They prove the math is correct - all three pressure-
# batch implementations and both numeric variants produce equivalent
# dispatch decisions.
#
# A second job placeholder shows where on-target builds (west +
# Zephyr SDK on a self-hosted apollo510b_evb runner) would slot in.
name: weaver-host-tests

on:
  push:
    branches: ["**"]
    paths:
      - 'weaver_scheduler/**'
      - '.github/workflows/weaver-host-tests.yml'
  pull_request:
    paths:
      - 'weaver_scheduler/**'
      - '.github/workflows/weaver-host-tests.yml'

jobs:
  host-equivalence:
    name: Host-side equivalence tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: scalar / hybrid / full-MVE equivalence
        working-directory: weaver_scheduler/tests/kernel/weaver_paths_equiv
        run: |
          gcc -std=c11 -O2 -Wall src/main.c -o /tmp/equiv
          /tmp/equiv | tee /tmp/equiv.log
          tail -1 /tmp/equiv.log | grep -q "ALL THREE PATHS EQUIVALENT"

      - name: fixed-point vs floating-point equivalence
        working-directory: weaver_scheduler/tests/kernel/weaver_fp_vs_fixed
        run: |
          gcc -std=c11 -O2 -Wall src/main.c -lm -o /tmp/wv_fp_eq
          /tmp/wv_fp_eq | tee /tmp/wv_fp_eq.log
          tail -1 /tmp/wv_fp_eq.log | grep -q "FIXED AND FLOAT VARIANTS EQUIVALENT"

  patch-applies:
    name: Patch applies to ambiqzephyr@ambiq-stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hal

      - name: Clone ambiqzephyr
        run: git clone --depth 1 --branch ambiq-stable
             https://github.com/RichardSWheatley/ambiqzephyr.git zephyr

      - name: git apply --check
        working-directory: zephyr
        run: git apply --check ../hal/weaver_scheduler/0001-weaver-scheduler.patch

  # Placeholder: on-target builds require a self-hosted runner with
  # the Zephyr SDK and a connected apollo510b_evb. Wire this in when
  # such a runner is available.
  on-target-build:
    name: west build for apollo510b_evb (DISABLED - needs self-hosted runner)
    if: false
    runs-on: [self-hosted, apollo510b_evb]
    steps:
      - uses: actions/checkout@v4
      - name: west build weaver_benchmark
        run: |
          cd zephyr
          west build -p -b apollo510b_evb \
              samples/boards/apollo510b_evb/weaver_benchmark
