# Benchmark hygiene (see zephyr tests/benchmarks/latency_measure):
# no time slicing, no PM surprises, coarse kernel ticks - pacing is
# counter-driven, not tick-driven.
CONFIG_COUNTER=y
CONFIG_TEST=y
CONFIG_TIMESLICING=n
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100
# Console output happens only after the measurement loop, so synchronous
# printk is not a concern here.
