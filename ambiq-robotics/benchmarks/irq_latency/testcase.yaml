common:
  tags:
    - arb
    - benchmark
  harness: console
  timeout: 300
  harness_config:
    type: one_line
    regex:
      - "BENCH DONE"
    record:
      regex:
        - "RECORD:(?P<metrics>.*)"
      as_json: ["metrics"]
  platform_allow:
    - apollo510_evb
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim
tests:
  arb.bench.irq_latency: {}
  arb.bench.irq_latency.loaded:
    extra_configs:
      - CONFIG_ZBUS=y
      - CONFIG_LOG=y
      - CONFIG_BENCH_LOAD=y
