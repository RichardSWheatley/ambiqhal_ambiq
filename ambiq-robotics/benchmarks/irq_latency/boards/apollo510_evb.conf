# DWT cycle counter for ns-resolution deltas (k_cycle_get on this SoC runs
# at the 32.768 kHz stimer rate, far too coarse for IRQ latency).
CONFIG_TIMING_FUNCTIONS=y
# The board defconfig enables PM; latency numbers with PM on measure
# wakeup, not interrupt latency.
CONFIG_PM=n
CONFIG_PM_DEVICE=n
CONFIG_PM_DEVICE_RUNTIME=n
CONFIG_HW_STACK_PROTECTION=n
