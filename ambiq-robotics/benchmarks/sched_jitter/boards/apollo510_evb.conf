# One kernel tick per stimer cycle: deadlines land exactly on hardware
# timer edges and the wake_err measurement has no tick-rounding bias.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=32768
# DWT cycle counter for the fine-grained period_jitter metric.
CONFIG_TIMING_FUNCTIONS=y
# Board defconfig enables PM; disable for latency measurements.
CONFIG_PM=n
CONFIG_PM_DEVICE=n
CONFIG_PM_DEVICE_RUNTIME=n
CONFIG_HW_STACK_PROTECTION=n
